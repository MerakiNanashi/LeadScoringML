# =========================================================
# DATASET CONFIGURATION
# =========================================================

dataset_type: "synthetic-01"

# =========================================================
# RANDOMNESS
# =========================================================

random_state: 42

# =========================================================
# DATA GENERATION
# =========================================================

n_samples: 100000
treatment_rate: 0.50
noise_std: 0.00
observational: false
include_revenue: true
clip_tau: true
base_conversion_rate: 0.10

# =========================================================
# EXPERIMENT CONTROL
# =========================================================

experiment: 1

# =========================================================
# DATASET-SPECIFIC OPTIONS
# =========================================================

hillstrom_treatment_type: "any_email"

# =========================================================
# CUSTOM DATASET PATHS
# =========================================================

path: null

# =========================================================
# SCHEMA MAPPING
# =========================================================

id_col: "lead_id"
outcome_col: "conversion"
treatment_col: "treatment"
time_col: "created_at"

# =========================================================
# SPLITTING
# =========================================================

test_size: 0.25
stratify: true
time_split: false

# =========================================================
# PREPROCESSING
# =========================================================

scale_numeric: true
one_hot_encode: true
impute_numeric_strategy: "median"
impute_categorical_strategy: "most_frequent"

# =========================================================
# OUTPUTS
# =========================================================

save_dataset: true